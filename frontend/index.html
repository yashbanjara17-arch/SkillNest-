<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillNest - Local Freelance Marketplace</title>
    <meta name="description" content="The Right Skills, Right Around You. A local-first freelance marketplace connecting businesses with verified professionals and teams in Boisar, Palghar, and beyond." />
    <meta property="og:title" content="SkillNest - Local Freelance Marketplace" />
    <meta property="og:description" content="The Right Skills, Right Around You. A local-first freelance marketplace connecting businesses with verified professionals and teams in Boisar, Palghar, and beyond." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('skillnest_theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-50 dark:bg-[#090d16] text-neutral-900 dark:text-neutral-100 antialiased selection:bg-indigo-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
